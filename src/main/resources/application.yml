spring:
  application:
    name: banco-preguntas-hexagonal
  datasource:
    url: jdbc:h2:mem:saberprodb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    show-sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8085

# Adaptador de persistencia activo: jpa (por defecto) | memory
saberpro:
  persistence: jpa
